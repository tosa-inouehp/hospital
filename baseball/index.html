<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>井上病院オーダー表</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: スコアボード風の固定ヘッダー＋タブ。打順は1行タップで編集シートを開く */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --ink:#16231c; --muted:#5b6a60; --line:#d5ddd3;
  --board:#1c4a35; --board-ink:#f3f7f1; --lamp:#e2a812; --helper:#a05a00; --helper-bg:#fdf1d8;

  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Oswald","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#16201a; --ink:#e5ece6; --muted:#93a397; --line:#2a3a31;
  --board:#163b2a; --board-ink:#eef4ee; --lamp:#f0bb2c; --helper:#f3c04a; --helper-bg:#3a2f12;
  --warn:#ff8f84; --warn-bg:#3a1b18; --grass:#1d3a29; --grass2:#22442f; --dirt:#4b3b25; --chalk:#d9e4da; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16201a; --ink:#e5ece6; --muted:#93a397; --line:#2a3a31;
  --board:#163b2a; --board-ink:#eef4ee; --lamp:#f0bb2c; --helper:#f3c04a; --helper-bg:#3a2f12;
  --warn:#ff8f84; --warn-bg:#3a1b18; --grass:#1d3a29; --grass2:#22442f; --dirt:#4b3b25; --chalk:#d9e4da; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--board-ink)}
.hd{display:flex;align-items:center;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin:0;letter-spacing:.04em;flex:1;min-width:8em}
.inning{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.25);border-radius:8px;padding:2px}
.inning button{width:32px;height:32px;border:0;background:transparent;color:var(--board-ink);font-size:1.1rem;border-radius:6px;cursor:pointer}
.inning output{font-family:var(--f-num);font-size:1.35rem;color:var(--lamp);min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.inning output small{font-family:var(--f-body);font-size:.75rem;color:var(--board-ink);margin-left:1px}
.dh{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--board-ink);border-radius:999px;padding:5px 12px 5px 6px;font:inherit;font-size:.85rem;cursor:pointer}
.dh i{width:30px;height:18px;border-radius:9px;background:rgba(255,255,255,.25);position:relative;transition:background .15s}
.dh i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--board-ink);transition:left .15s}
.dh[aria-pressed="true"] i{background:var(--lamp)}
.dh[aria-pressed="true"] i::after{left:14px}
nav{display:flex;gap:4px}

main{padding-block:16px 48px;display:grid;gap:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.note{background:var(--helper-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.85rem;display:flex;gap:10px;align-items:flex-start}
.note button{margin-left:auto;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:2rem 2.6rem 1fr auto;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}

.nm{min-width:0;font-weight:500;font-size:1.02rem;overflow-wrap:anywhere}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.pri{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.btn.amber{background:var(--lamp);color:#1d1600;border-color:var(--lamp)}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:.85rem}

.field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}

.rost{display:grid;grid-template-columns:4rem 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.rost:first-child{border-top:0}
.rost input,.addf input,.sheet select,.sheet input[type=text]{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rost input.n,.addf input.n{font-family:var(--f-num);text-align:center}
.addf{display:grid;grid-template-columns:4rem 1fr auto;gap:8px;padding:12px;background:color-mix(in srgb,var(--board) 6%,var(--surface))}
.inuse{font-size:.72rem;color:var(--muted);white-space:nowrap}

.log li{display:grid;grid-template-columns:3.2rem 1fr;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log ol{list-style:none;margin:0;padding:0}
.log .inn{font-family:var(--f-num);color:var(--board);font-size:1.05rem}
.log .ty{font-size:.75rem;font-weight:700;color:var(--muted);display:block}
.empty-s{padding:20px 12px;color:var(--muted);font-size:.9rem;text-align:center}

.back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:600px;margin:0 auto;display:grid;gap:14px}
.sheet h2{margin:0;font-size:1.1rem;display:flex;align-items:center;gap:10px}

.fl{display:grid;gap:4px}
.fl > span{font-size:.8rem;font-weight:700;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--lamp)}
.hint{font-size:.78rem;color:var(--muted)}
.posgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.posgrid button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 0;font:inherit;font-weight:700;cursor:pointer}
.posgrid button[aria-pressed="true"]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.subbox{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.types button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:#1d1600;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:30}
textarea.fb{width:100%;min-height:9rem;font:inherit;font-size:.85rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
nav button{font-size:.85rem;white-space:nowrap;min-width:0}
.sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum b{font-family:var(--f-num);font-size:1.8rem;color:var(--board);font-variant-numeric:tabular-nums;margin-right:2px}
.wtxt{color:var(--warn);font-size:.85rem;font-weight:500}
.sechd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sechd .sec{margin:0}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.att{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.att input{width:20px;height:20px;accent-color:var(--board);flex:none}
.att .num{min-width:2.2em}
.att .an{min-width:0;overflow-wrap:anywhere;flex:1}
.att.on{background:color-mix(in srgb,var(--board) 9%,transparent)}
.att.on .an{font-weight:700}
.hrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow input,.hrow select,.hadd select{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.hprev{grid-column:1/-1;font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addf.hadd{grid-template-columns:1fr 1fr auto;border-top:1px solid var(--line)}
@media (max-width:420px){.hrow,.addf.hadd{grid-template-columns:1fr 1fr}.hrow .btn,.addf.hadd .btn{grid-column:1/-1}}
.sbwrap{overflow-x:auto;background:var(--board);color:var(--board-ink);border-radius:12px;padding:10px 8px}
.sb{border-collapse:collapse;width:100%;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sb th,.sb td{text-align:center;padding:5px 2px;min-width:1.9em;font-weight:500}
.sb thead th{font-size:.8rem;opacity:.75;font-weight:500}
.sb .tm{text-align:left;font-family:var(--f-body);font-weight:700;white-space:nowrap;padding-right:8px;max-width:7.5em;overflow:hidden;text-overflow:ellipsis}
.sb td button{width:100%;border:0;background:transparent;color:inherit;font:inherit;font-size:1.15rem;padding:3px 0;border-radius:5px;cursor:pointer}
.sb td button.cur{background:var(--lamp);color:#1d1600;font-weight:700}
.sb td button.fut{opacity:.35}
.sb .tot{font-size:1.4rem;font-weight:600;color:var(--lamp);border-left:1px solid rgba(255,255,255,.25);padding-left:8px}
.gset{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.gset input{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);font:inherit;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--board);color:var(--board-ink);font-weight:700}
.now{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.nowhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nowhd b{font-family:var(--f-num);font-size:1.5rem;color:var(--board)}
.nowhd .who{font-weight:700}
.nowhd .who.us{color:var(--board)}
.nowhd .rr{margin-left:auto;display:flex;align-items:center;gap:6px}
.nowhd .rr output{font-family:var(--f-num);font-size:1.4rem;min-width:1.4em;text-align:center}
.pa{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.pa select,.pa input{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pa .two{display:grid;grid-template-columns:1fr 6.5rem;gap:8px}
.log .inn{font-size:.95rem;white-space:nowrap}
.log li.sub .ty{color:var(--helper)}
.log li.pl .ty{color:var(--board)}
.log .rs{font-family:var(--f-num);color:var(--warn);font-weight:600;margin-left:6px}
.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.st th,.st td{padding:6px 3px;border-top:1px solid var(--line);text-align:center;font-family:var(--f-num)}
.st thead th{border-top:0;font-family:var(--f-body);font-size:.75rem;font-weight:700;color:var(--muted)}
.st .n{text-align:left;font-family:var(--f-body);overflow-wrap:anywhere}
.st td.o{color:var(--board);font-weight:600;width:1.6em}
.st tr.tot td{font-weight:700}
.past{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.past:first-child{border-top:0}
.past b{font-family:var(--f-num);font-size:1.15rem}
.wl{font-size:.8rem;font-weight:700;color:var(--muted)}
.wl.w{color:var(--board)}
@media (max-width:420px){.past{grid-template-columns:1fr auto auto}.past .actions{grid-column:1/-1}}
.outs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.outs i{width:16px;height:16px;border-radius:50%;border:2px solid var(--warn);display:inline-block}
.outs i.on{background:var(--warn)}
.outs .hint:last-child{flex-basis:100%}
.gset2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gset2 input{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="hd">
      <h1>井上病院</h1>
      <div class="inning" aria-label="現在のイニング">
        <button id="inn-dn" aria-label="前へ">−</button>
        <output id="inn"></output>
        <button id="inn-up" aria-label="次へ">＋</button>
      </div>
      <button class="dh" id="dh" aria-pressed="false"><i></i>DH</button>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="today">ベンチ入り</button>
      <button role="tab" data-tab="order">打順</button>
      <button role="tab" data-tab="field">守備</button>
      <button role="tab" data-tab="game">試合</button>
      <button role="tab" data-tab="roster">名簿</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="back" id="back" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>

<script>
const FIELD=['投','捕','一','二','三','遊','左','中','右'];
const KEY='inoue-order-v2';
const SK=p=>p.num==='監督'?-2:p.num==='主将'?-1:(p.num!==''&&!isNaN(+p.num)?+p.num:999);
const byNum=(a,b)=>SK(a)-SK(b);
const TYPES=['代打','代走','守備交代','投手交代'];
/* 盗塁は打者の結果ではなく走者の記録なので、打席の結果ボタンとは別に記録する（NOT_PA には旧データのため残す） */
const RESULTS=['安打','二塁打','三塁打','本塁打','四球','死球','三振','凡打','犠打・犠飛','失策で出塁','野選','その他'];
const RUNNER=['盗塁','盗塁死','牽制死','暴投','捕逸','走塁死','その他'];
const NOT_PA=['盗塁','その他'];
const ymd=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const newGame=()=>({opp:'',first:true,runs:{us:{},opp:{}},next:0,oppNext:0,date:ymd(),outs:0,pOuts:{},pBase:0,oppOuts:{},oppBase:0,cup:'',oppP:''});
let S, sheetCtx=null, toastT;

const emptyS=()=>({pid:null,helper:'',hid:null});
const empty9=()=>Array.from({length:9},()=>({...emptyS(),pos:''}));
const uid=(p)=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
/* 公開リポジトリのため部員名は書かない。初回は「名簿」タブで各端末に登録する */
function sample(){
  return {v:4,dh:false,inning:1,half:0,tab:'roster',roster:[],today:{members:[],helpers:[]},lineup:empty9(),pitcher:emptyS(),log:[],game:newGame(),history:[]};
}
function migrate(){
  if(!S.game)S.game=newGame();if(S.half===undefined)S.half=0;if(S.tab==='log')S.tab='game';if(!S.history)S.history=[];
  S.log.forEach(l=>{if(!l.kind)l.kind='sub';if(l.half===undefined)l.half=null});
  S.roster.forEach(p=>{if(p.num==='監督')p.num='30';if(p.num==='主将')p.num='10'});
  [...S.lineup,S.pitcher].forEach(s=>{if(s.hid===undefined)s.hid=null});
  if(!S.today){
    S.today={members:[],helpers:[]};
    [...S.lineup,S.pitcher].forEach(s=>{if(!s.pid)return;
      if(s.helper){const h={id:uid('h'),name:s.helper,as:s.pid};S.today.helpers.push(h);s.hid=h.id}
      else if(!S.today.members.includes(s.pid))S.today.members.push(s.pid)});
    S.tab='today';
  }
}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);migrate();return}}catch(e){}S=sample()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.roster.find(p=>p.id===id);
const H=id=>S.today.helpers.find(h=>h.id===id);
const numTxt=p=>p?(p.num===''||isNaN(+p.num)?esc(p.num):'#'+esc(p.num)):'';
const keyOf=s=>s.hid?'h:'+s.hid:(s.pid?'m:'+s.pid:null);
function fromKey(k){if(!k)return emptyS();
  if(k.startsWith('h:')){const h=H(k.slice(2));return h?{pid:h.as||null,helper:h.name,hid:h.id}:emptyS()}
  return {pid:k.slice(2),helper:'',hid:null}}
/* 助っ人は「本人の名前（名義）」で表す。外に出すテキスト・画像は S.shareMode==='name' なら名義だけにする */
function plain(s){const p=P(s.pid);if(!p)return s.helper?`${s.helper}（名義未設定）`:'未選択';return s.helper?`${s.helper}（${p.name}）`:p.name}
const nominalOnly=()=>S.shareMode==='name';
const helperPairs=()=>S.today.helpers.filter(h=>h.as&&P(h.as)).map(h=>({h:h.name,n:P(h.as).name}));
function maskText(txt,pairs=helperPairs()){
  if(!nominalOnly())return txt;
  pairs.forEach(({h,n})=>{txt=txt.split(`${h}（${n}）`).join(n).split(`${n}（${h}）`).join(n)});
  return txt;
}
const shareSeg=()=>`<div class="fl"><span>LINEに出す助っ人の表記</span><div class="seg">
  <button data-smode="both" aria-pressed="${!nominalOnly()}">名前（名義）</button><button data-smode="name" aria-pressed="${nominalOnly()}">名義だけ</button></div></div>`;
function label(s){const p=P(s.pid);if(!p)return '';
  return s.helper?`<span class="hp">${esc(s.helper)}</span>（${esc(p.name)}）`:esc(p.name)}
function slots(){const a=S.lineup.map((s,i)=>({s,lab:(i+1)+'番'}));if(S.dh)a.push({s:S.pitcher,lab:'投手'});return a}
const onKey=k=>slots().some(x=>keyOf(x.s)===k);
const memberUsed=pid=>slots().some(x=>x.s.pid===pid)||S.today.helpers.some(h=>h.as===pid);
function entries(){
  const m=S.roster.filter(p=>S.today.members.includes(p.id)).sort(byNum).map(p=>({key:'m:'+p.id,pid:p.id,helper:'',hid:null}));
  const h=S.today.helpers.map(x=>({key:'h:'+x.id,pid:x.as||null,helper:x.name,hid:x.id}));
  return m.concat(h);
}
function outSet(){const o=new Set();S.log.forEach(l=>{if(l.out&&!onKey(l.out))o.add(l.out)});return o}
function clearKey(k){slots().forEach(({s})=>{if(keyOf(s)===k){s.pid=null;s.helper='';s.hid=null}})}

const HALF=['表','裏'];
const innTxt=(i,h)=>`${i}回${h===null||h===undefined?'':HALF[h]}`;
const usBat=(h=S.half)=>(h===0)===S.game.first;
const oppName=()=>S.game.opp.trim()||'相手';
/* 試合終了：g.end={inn,half} は最後に行った攻撃。表で終わったら後攻のその回は X */
const endX=(i,h)=>{const E=S.game.end;return !!E&&E.half===0&&i===E.inn&&h===1};
function resultTxt(){const u=total('us'),o=total('opp');return `井上病院 ${u}－${o} ${oppName()}　${u>o?'勝ち':u<o?'負け':'引き分け'}`}
function total(side){return Object.values(S.game.runs[side]).reduce((a,b)=>a+(+b||0),0)}
function addRuns(side,inn,n){const r=S.game.runs[side];r[inn]=Math.max(0,(+r[inn]||0)+n);if(!r[inn]&&n<0)delete r[inn]}
function issues(){
  const out=[],used={};
  slots().forEach(({s,lab})=>{if(!s.pid)out.push(lab+(s.helper?'の助っ人の名義が未設定':'の選手が未選択'));else(used[s.pid]=used[s.pid]||[]).push(lab)});
  for(const id in used)if(used[id].length>1)out.push(`「${P(id)?.name||'?'}」の名前が重複（${used[id].join('・')}）`);
  const need=S.dh?[...FIELD.filter(p=>p!=='投'),'DH']:FIELD;
  const cnt={};S.lineup.forEach(s=>{if(s.pos)cnt[s.pos]=(cnt[s.pos]||0)+1});
  need.forEach(p=>{if(!cnt[p])out.push(`守備「${p}」が空いています`);else if(cnt[p]>1)out.push(`守備「${p}」が重複`)});
  return out;
}
function helperWarn(h){
  if(!h.as)return '名義にするメンバーを選んでください';
  if(S.today.members.includes(h.as))return `${P(h.as)?.name}さんは出席にしています。名前が重なります`;
  if(S.today.helpers.some(x=>x!==h&&x.as===h.as))return '同じ名義の助っ人がほかにもいます';
  return '';
}

function vField(){

function vGame(){
  const g=S.game,maxInn=Math.max(7,S.inning,...Object.keys(g.runs.us).map(Number),...Object.keys(g.runs.opp).map(Number));

  const E=g.end;
  const cell=(side,i,h)=>{const v=g.runs[side][i];const cur=!E&&i===S.inning&&h===S.half;
    const x=v===undefined&&endX(i,h);
    const fut=!x&&(E?i>E.inn||(i===E.inn&&h>E.half):i>S.inning||(i===S.inning&&h>S.half));
    return `<td><button data-cell="${i},${h}" class="${cur?'cur':''} ${fut?'fut':''}" aria-label="${innTxt(i,h)}">${v!==undefined?v:(x?'X':(fut?'':(cur?'·':'0')))}</button></td>`};
  const board=`<div class="sbwrap"><table class="sb"><thead><tr><th class="tm"></th>${Array.from({length:maxInn},(_,k)=>`<th>${k+1}</th>`).join('')}<th class="tot">計</th></tr></thead>
    <tbody>${order.map(([side,name,h])=>`<tr><td class="tm">${esc(name)}</td>${Array.from({length:maxInn},(_,k)=>cell(side,k+1,h)).join('')}<td class="tot">${total(side)}</td></tr>`).join('')}</tbody></table></div>`;

      <div class="types" id="sr-t">${RUNNER.map(r=>`<button type="button" data-srt="${r}" aria-pressed="${r===srType}">${r}</button>`).join('')}</div>
      <input type="text" id="sr-m" value="${esc(srMemo)}" placeholder="メモ（任意）例：二塁から三塁へ、捕手の悪送球">
      <div class="actions"><button class="btn" data-act="runner" ${srType?'':'disabled'} id="sr-go">走者を記録</button></div></div>`;
  const tl=S.log.slice().reverse().map(l=>`<li class="${l.kind==='play'?'pl':'sub'}"><span class="inn">${innTxt(l.inning,l.half)}</span><span><span class="ty">${esc(l.type)}</span>${esc(l.text)}${l.runs?`<span class="rs">+${l.runs}点</span>`:''}</span></li>`).join('');
  return `<div class="gset"><input type="text" id="g-opp" value="${esc(g.opp)}" placeholder="対戦相手のチーム名" aria-label="対戦相手">
    <div class="seg"><button data-first="1" aria-pressed="${g.first}">先攻</button><button data-first="0" aria-pressed="${!g.first}">後攻</button></div></div>
  <div class="gset2"><label class="fl"><span>大会名（任意）</span><input type="text" id="g-cup" value="${esc(g.cup||'')}" placeholder="例：第15回 ○○大会"></label>
    <label class="fl"><span>現在の相手投手</span><input type="text" id="g-oppP" value="${esc(g.oppP||'')}" placeholder="名前（任意）">
      <span class="hint">交代したら下の「相手の投手交代」で記録</span></label></div>
  ${board}
  ${E?`<div class="now"><div class="nowhd"><b>試合終了</b><span class="who us">${resultTxt()}</span></div>
    <span class="hint">${innTxt(E.inn,E.half)}で終了しました。続けて記録する場合は再開してください。</span>
    <div class="actions"><button class="btn" data-act="resume" data-confirm>試合を再開する</button></div></div>`:`
  <div class="now"><div class="nowhd"><b>${innTxt(S.inning,S.half)}</b><span class="who ${bat?'us':''}">${bat?'井上病院の攻撃':esc(oppName())+'の攻撃'}</span>
    <span class="rr"><button class="btn sm" data-run="-1" aria-label="1点減らす">−</button><output>${cur}</output><button class="btn sm pri" data-run="1">＋1点</button></span></div>
    <div class="outs"><span class="hint">アウト</span>${[0,1,2].map(i=>`<i class="${i<(g.outs||0)?'on':''}"></i>`).join('')}
      <button class="btn sm" data-out="-1" aria-label="アウトを1つ減らす">−</button><button class="btn sm" data-out="1">＋アウト</button>
      <span class="hint">三振・凡打・犠打・盗塁死などは自動で数えます</span></div>
    ${pa}
    <div class="pa"><span class="sec" style="margin:0">選手交代</span>
      <div class="actions"><button class="btn" data-act="subpick">代打・代走・守備交代・投手交代を記録</button>

function applySheet(logIt){
  const c=sheetCtx,isP=c.key==='P';const s=isP?S.pitcher:S.lineup[c.key];
  const nw={...fromKey(c.sel),pos:isP?'':c.pos};
  const k0=keyOf(curPitcher());
  if(logIt){markStart();
    const old={pid:s.pid,helper:s.helper,hid:s.hid,pos:s.pos};
    const who=isP?'投手':(+c.key+1)+'番';
    const changed=keyOf(old)!==keyOf(nw);let text;
    if(changed){text=`${who} ${plain(old)} → ${plain(nw)}`;
      if(!isP)text+=old.pos!==nw.pos?`（${old.pos||'—'}→${nw.pos||'—'}）`:(nw.pos?`（${nw.pos}）`:'');}
    else if(!isP&&old.pos!==nw.pos)text=`${who} ${plain(old)} 守備 ${old.pos||'—'}→${nw.pos||'—'}`;
    else{toast('変更がありません');return}
    S.log.push({kind:'sub',inning:S.inning,half:S.half,type:c.type,text,out:changed?keyOf(old):null,
      bi:isP?null:+c.key,inKey:changed?keyOf(nw):null,snap:JSON.stringify({lineup:S.lineup,pitcher:S.pitcher})});
  }
  s.pid=nw.pid;s.helper=nw.helper;s.hid=nw.hid;if(!isP)s.pos=nw.pos;
  /* 守備中の回の途中で投手が代わったら、それまでのアウトを前の投手に積む */
  const g=S.game;if(!usBat()&&!g.end&&keyOf(curPitcher())!==k0&&S.log.length){const o=g.outs||0;
    g.pOuts=g.pOuts||{};g.pOuts[k0||'']=(g.pOuts[k0||'']||0)+Math.max(0,o-(g.pBase||0));g.pBase=o}
  save();closeSheet();render();toast(logIt?'交代を記録しました':'保存しました');
}

/* ---------- 成績の集計（打席の記録から数える） ---------- */
const HITS=['安打','二塁打','三塁打','本塁打'],WALKS=['四球','死球'],CIRC='①②③④⑤⑥⑦⑧⑨';
const curPitcher=()=>S.dh?S.pitcher:(S.lineup.find(s=>s.pos==='投')||emptyS());
const nameOf=k=>k?plain(fromKey(k)):'投手未設定';
const gameDate=()=>S.game.date?new Date(S.game.date+'T00:00'):new Date();
function stats(){
  const B=new Map(),slots=Array.from({length:9},()=>[]);
  const add=(i,k)=>{if(k&&i>=0&&i<9&&!slots[i].includes(k))slots[i].push(k)};
  /* 交代で退いた先発も打順の位置に残す（打席が無くても①〜⑨の行を出す） */
  S.log.forEach(l=>{if(l.kind==='sub'&&l.bi!=null&&l.out){add(l.bi,l.out);add(l.bi,l.inKey);return}
    if(l.kind!=='play'||l.side!=='us'||!l.key||l.run||NOT_PA.includes(l.type))return;
    add(l.bi,l.key);let r=B.get(l.key);if(!r)B.set(l.key,r={pa:0,ab:0,h:0,rbi:0,so:0,bb:0});
    r.pa++;if(!WALKS.includes(l.type)&&l.type!=='犠打・犠飛')r.ab++;if(HITS.includes(l.type))r.h++;
    if(l.type==='三振')r.so++;if(WALKS.includes(l.type))r.bb++;if(l.type!=='失策で出塁')r.rbi+=l.runs||0});
  S.lineup.forEach((s,i)=>add(i,keyOf(s)));
  const seen=new Set(),bat=[];
  slots.forEach((ks,i)=>ks.forEach((k,j)=>{if(seen.has(k))return;seen.add(k);bat.push({key:k,ord:j===0?i+1:0,...(B.get(k)||{pa:0,ab:0,h:0,rbi:0,so:0,bb:0})})}));
  const Pm=new Map();
  S.log.forEach(l=>{if(l.kind!=='play'||l.side!=='opp')return;
    const notPA=l.run||NOT_PA.includes(l.type);if(notPA&&!l.runs)return;
    const k=l.pit||'';let r=Pm.get(k);if(!r)Pm.set(k,r={key:k,bf:0,h:0,so:0,bb:0,r:0});
    if(notPA){r.r+=l.runs;return}  /* 暴投などで入った点は失点にだけ数える */
    r.bf++;if(HITS.includes(l.type))r.h++;if(l.type==='三振')r.so++;if(WALKS.includes(l.type))r.bb++;r.r+=l.runs||0});
  const tot=bat.reduce((a,r)=>{['ab','h','rbi','so','bb'].forEach(f=>a[f]+=r[f]);return a},{ab:0,h:0,rbi:0,so:0,bb:0});
  const po=pitOuts();
  Object.keys(po.m).forEach(k=>{if(!Pm.has(k)&&po.m[k])Pm.set(k,{key:k,bf:0,h:0,so:0,bb:0,r:0})});
  const pit=[...Pm.values()].map(r=>({...r,outs:po.m[r.key]||0}));
  /* 相手投手：こちらの打席から数える（相手の継投は区別しない） */
  /* 相手投手：こちらの打席を、そのとき投げていた相手投手（l.op）ごとに数える。
     ＋1点ボタンだけで入れた点は、いま投げている投手の失点にまとめる */
  const cur=oppPitName(),OP=new Map(),get=n=>{let r=OP.get(n);if(!r)OP.set(n,r={name:n,bf:0,h:0,so:0,bb:0,r:0,outs:0});return r};
  let logged=0;
  S.log.forEach(l=>{if(l.kind==='sub'&&l.side==='opp'){get(l.prevOp);return}
    if(l.kind!=='play'||l.side!=='us')return;const r=get(l.op||cur);r.r+=l.runs||0;logged+=l.runs||0;
    if(l.run||NOT_PA.includes(l.type)||!RESULTS.includes(l.type))return;
    r.bf++;if(HITS.includes(l.type))r.h++;if(l.type==='三振')r.so++;if(WALKS.includes(l.type))r.bb++});
  Object.keys(po.opp).forEach(n=>get(n).outs=po.opp[n]);
  if(total('us')>logged)get(cur).r+=total('us')-logged;
  const opp=[...OP.values()].filter(r=>r.bf||r.outs||r.r);
  return {bat,tot,pit,opp,any:bat.some(r=>r.pa)||pit.length>0};
}
function vStats(){
  const st=stats();if(!st.any)return '';
  const br=st.bat.map(r=>`<tr><td class="o">${r.ord||''}</td><td class="n">${esc(nameOf(r.key))}</td><td>${r.ab}</td><td>${r.h}</td><td>${r.rbi}</td><td>${r.so}</td><td>${r.bb}</td></tr>`).join('');
  const t=st.tot;
  const prow=(nm,r)=>`<tr><td class="n">${nm}</td><td>${ipTxt(r.outs)}</td><td>${r.bf}</td><td>${r.h}</td><td>${r.so}</td><td>${r.bb}</td><td>${r.r}</td></tr>`;
  const pr=st.pit.map(r=>prow(esc(nameOf(r.key)),r)).join('')+st.opp.map(r=>prow(`<span class="hint">${esc(r.name)}</span>`,r)).join('');
  return `<div><p class="sec">成績（記録した打席から自動集計）</p><div class="card" style="padding:4px 10px">
    <table class="st"><thead><tr><th></th><th class="n">打撃</th><th>打</th><th>安</th><th>点</th><th>振</th><th>球</th></tr></thead>
    <tbody>${br}<tr class="tot"><td></td><td class="n">計</td><td>${t.ab}</td><td>${t.h}</td><td>${t.rbi}</td><td>${t.so}</td><td>${t.bb}</td></tr></tbody></table>
    ${pr?`<table class="st" style="margin-top:6px"><thead><tr><th class="n">投手</th><th>回</th><th>打者</th><th>安</th><th>振</th><th>球</th><th>失</th></tr></thead><tbody>${pr}</tbody></table>`:''}
  </div><p class="hint" style="margin:6px 0 0">打点は「この打席で入った点」から数えます（失策での出塁は除く）。＋1点ボタンだけで入れた点は数えません。</p></div>`;
}
function gameText(){
  const g=S.game,d=gameDate(),maxInn=Math.max(S.inning,...Object.keys(g.runs.us).map(Number),...Object.keys(g.runs.opp).map(Number),1);
  const L=[`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 井上病院 ${total('us')} - ${total('opp')} ${oppName()}`];
  const cup=(g.cup||'').trim();
  const order=g.first?[['us','井上病院'],['opp',oppName()]]:[['opp',oppName()],['us','井上病院']];
  const E=g.end;if(E)L[0]+=`（試合終了・${resultTxt().split('　').pop()}）`;
  order.forEach(([sd,n],h)=>L.push(`${n}　${Array.from({length:E?E.inn:maxInn},(_,k)=>{const i=k+1,v=g.runs[sd][i];if(v!==undefined)return v;if(endX(i,h))return 'X';
    return (E?i>E.inn||(i===E.inn&&h>E.half):i>S.inning||(i===S.inning&&h>=S.half))?'-':0}).join(' ')}　計${total(sd)}`));
  const st=stats();
  if(st.bat.some(r=>r.pa)){const t=st.tot;L.push('','【井上病院 打撃成績】打 安 点 振 球');
    st.bat.forEach(r=>L.push(`${r.ord?CIRC[r.ord-1]:'　'}${nameOf(r.key)}　${r.ab} ${r.h} ${r.rbi} ${r.so} ${r.bb}`));
    L.push(`　計　${t.ab} ${t.h} ${t.rbi} ${t.so} ${t.bb}`)}
  const pl=r=>`${ipTxt(r.outs)} ${r.bf} ${r.h} ${r.so} ${r.bb} ${r.r}`;
  if(st.pit.length||st.opp.length){L.push('','【投手成績】回 打者 安 振 球 失');
    if(st.pit.length){L.push('井上病院');st.pit.forEach(r=>L.push(`　${nameOf(r.key)}　${pl(r)}`))}
    if(st.opp.length){L.push(oppName());st.opp.forEach(r=>L.push(`　${r.name}　${pl(r)}`))}}
  if(S.log.length){L.push('','【試合経過】');S.log.forEach(l=>L.push(`${innTxt(l.inning,l.half)} ${l.type}：${l.text}${l.runs?`（+${l.runs}点）`:''}`))}
  if(cup)L.unshift(cup);
  return L.join('\n');
}

function importRoster(txt){
  let n=0,add=0,upd=0;const key=s=>s.replace(/[\s　]/g,'');
  txt.split(/\r?\n/).forEach(l=>{l=l.normalize('NFKC').trim();if(!l||l.startsWith('【'))return;
    const m=l.match(/^#?(\d{1,3})[\s　,、]+(.+)$/);const num=m?m[1]:'',name=(m?m[2]:l).trim();n++;
    const p=S.roster.find(x=>key(x.name)===key(name));
    if(p){if(num&&p.num!==num){p.num=num;upd++}}else{S.roster.push({id:uid('p'),name,num});add++}});
  return {n,add,upd};
}
function copyText(txt){
  const fb=()=>{document.getElementById('fb').innerHTML=`<textarea class="fb" id="fbt" readonly>${esc(txt)}</textarea>`;const x=document.getElementById('fbt');x.focus();x.select();toast('選択した文字をコピーしてください')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('コピーしました。LINEなどに貼り付けできます'),fb)}catch(err){fb()}
}
/* アウトカウント：結果から自動で数える。チェンジ時に守っていた投手へアウト数（＝投球回）を積む。
   g.pBase は回の途中で投手が代わったときの、その投手が登板した時点のアウト数 */
const OUT_PA=['三振','凡打','犠打・犠飛'],OUT_RUN=['盗塁死','牽制死','走塁死'];
const ipTxt=o=>o%3?`${o>=3?Math.floor(o/3):''}${['','⅓','⅔'][o%3]}`:String(o/3);
function addOut(n){S.game.outs=Math.max(0,Math.min(3,(S.game.outs||0)+n))}
function creditOuts(n){const g=S.game;n=Math.min(3,n);
  if(usBat()){const k=oppPitName();g.oppOuts=g.oppOuts||{};g.oppOuts[k]=(g.oppOuts[k]||0)+Math.max(0,n-(g.oppBase||0))}
  else{const k=keyOf(curPitcher())||'';g.pOuts=g.pOuts||{};g.pOuts[k]=(g.pOuts[k]||0)+Math.max(0,n-(g.pBase||0))}
  g.pBase=0;g.oppBase=0}
/* 集計用：確定分＋いま進行中の回のアウト。アウトを数えていない（0のまま）回は、チェンジ・試合終了時に3アウトとみなす */
function pitOuts(){const g=S.game,m={...(g.pOuts||{})},opp={...(g.oppOuts||{})};
  const live=g.end?((g.outs||0)||3):(g.outs||0);
  if(usBat()){const k=oppPitName();const n=Math.max(0,live-(g.oppBase||0));if(n)opp[k]=(opp[k]||0)+n}
  else{const k=keyOf(curPitcher())||'';const n=Math.max(0,live-(g.pBase||0));if(n||m[k]!==undefined)m[k]=(m[k]||0)+n}
  return {m,opp}}
/* 相手の投手交代：攻撃中ならそこまでのアウトを前の投手に積み、以後の打席は新しい投手につける */
function openOppPitch(){
  sheetCtx={key:'opp'};
  const n=new Set([...S.log.filter(l=>l.op).map(l=>l.op),oppPitName()]).size+1;
  document.getElementById('sheet').innerHTML=`<div class="in">
    <h2>相手の投手交代<span class="hint" style="font-weight:400">${innTxt(S.inning,S.half)}</span></h2>
    <p class="hint" style="margin:0">いま：<b>${esc(oppPitName())}</b></p>
    <label class="fl"><span>代わった投手の名前（分からなければ空欄のままで「相手投手${n}」になります）</span>
      <input type="text" id="op-new" placeholder="相手投手${n}" style="font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></label>
    <div class="actions"><button class="btn amber" data-act="opprec" data-n="${n}">投手交代を記録</button><button class="btn" data-sh="close">閉じる</button></div></div>`;
  document.getElementById('back').hidden=false;document.getElementById('sheet').hidden=false;
}
function recordOppPitch(nm){
  const g=S.game,old=oppPitName();if(nm===old){toast('いまの投手と同じ名前です');return false}
  const snap=JSON.stringify({oppP:g.oppP,oppOuts:g.oppOuts||{},oppBase:g.oppBase||0});markStart();
  if(usBat()&&!g.end){const o=g.outs||0;g.oppOuts=g.oppOuts||{};g.oppOuts[old]=(g.oppOuts[old]||0)+Math.max(0,o-(g.oppBase||0));g.oppBase=o}
  S.log.push({kind:'sub',side:'opp',inning:S.inning,half:S.half,type:'相手投手交代',text:`${oppName()} ${old} → ${nm}`,prevOp:old,oppSnap:snap});
  g.oppP=nm;return true;
}
/* 前回のオーダー用：最初に記録した時点の打順を試合の先発として残す */
function markStart(){if(!S.game.start)S.game.start=JSON.stringify({lineup:S.lineup,pitcher:S.pitcher,dh:S.dh})}
let paRes=null,paMemo='';
/* 打席・メモの記録。入力中のメモは paMemo に持つので、点数の±などで画面を描き直しても消えない */
function recordPA(){
  const us=usBat(),side=us?'us':'opp',bi=+document.getElementById('pa-b').value,runs=+document.getElementById('pa-r').value,m=paMemo.trim();
  let who,key=null,pit=null;
  if(us){const sl=S.lineup[bi];key=keyOf(sl);who=`${bi+1}番 ${sl.pid||sl.helper?plain(sl):`${bi+1}番`}`}
  else{who=`相手${bi+1}番`;pit=keyOf(curPitcher())}
  markStart();const o=OUT_PA.includes(paRes)?1:0;
  S.log.push({kind:'play',inning:S.inning,half:S.half,type:paRes,text:`${who}${m?'　'+m:''}`,runs,side,bi,key,pit,o,op:us?oppPitName():null});
  if(runs)addRuns(side,S.inning,runs);addOut(o);
  if(!NOT_PA.includes(paRes)){if(us)S.game.next=(bi+1)%9;else S.game.oppNext=(bi+1)%9}
  paRes=null;paMemo='';return runs;
}
/* 走者の記録（盗塁・牽制死・暴投など）：選んでいる打席の結果・メモ・次の打者は変えない。run:true は成績の打席に数えない印 */
let srType=null,srMemo='';
function recordRunner(){
  const us=usBat(),side=us?'us':'opp',bi=+document.getElementById('pa-sr').value,runs=+document.getElementById('pa-sr-r').value,m=srMemo.trim();
  let who,key=null;if(us){const sl=S.lineup[bi];key=keyOf(sl);who=`${bi+1}番 ${sl.pid||sl.helper?plain(sl):`${bi+1}番`}`}else who=`相手${bi+1}番`;
  markStart();const o=OUT_RUN.includes(srType)?1:0;
  S.log.push({kind:'play',run:true,inning:S.inning,half:S.half,type:srType,text:`${who}${m?'　'+m:''}`,runs,side,bi,key,pit:us?null:keyOf(curPitcher()),o,op:us?oppPitName():null});
  if(runs)addRuns(side,S.inning,runs);addOut(o);
  const t=srType;srType=null;srMemo='';return {t,who,runs};
}
function recordMemo(type){S.log.push({kind:'play',inning:S.inning,half:S.half,type,text:paMemo.trim(),runs:0});paMemo=''}
/* チェンジ・試合終了の前に、記録ボタンを押し忘れた打席結果・メモを記録する */
function flushPending(){
  let kept=false;if(srType){recordRunner();kept=true}
  if(paRes){recordPA();return true}
  if(kept&&!paMemo.trim())return true;
  if(paMemo.trim()){recordMemo(usBat()?'メモ':'守備');return true}
  return false;
}
function setDH(on){
  if(on===S.dh)return;
  if(on){const i=S.lineup.findIndex(s=>s.pos==='投');
    if(i>=0){const s=S.lineup[i];S.pitcher={pid:s.pid,helper:s.helper,hid:s.hid};S.lineup[i]={...emptyS(),pos:'DH'}}
    else S.pitcher=emptyS();
  }else{const i=S.lineup.findIndex(s=>s.pos==='DH');
    if(i>=0)S.lineup[i]={...S.pitcher,pos:'投'};
    S.pitcher=emptyS();
  }
  S.dh=on;save();render();toast(on?'DH制にしました：DHの打者を選んでください':'DHなしにしました');
}

  if(t.id==='inn-dn'){if(S.half)S.half=0;else if(S.inning>1){S.inning--;S.half=1}save();render();return}

  if(a==='bimg'){benchImage().then(cv=>openShareImage(cv,'ベンチ入り画像','ベンチ入りメンバーの画像','bench'));return}
  if(a==='oimg'){orderImage().then(cv=>openShareImage(cv,'オーダー画像','スターティングオーダーの画像','order'));return}
  if(a==='ishare'){if(shareFile)navigator.share({files:[shareFile]}).catch(()=>{});return}
  if(a==='rimp'){const r=importRoster(document.getElementById('rimp').value);
    if(!r.n){toast('名簿を貼り付けてください');return}
    save();render();toast(r.add||r.upd?`${r.add}人追加・${r.upd}人の背番号を更新しました`:'すべて登録済みでした');return}
  if(a==='allin'){S.today.members=S.roster.map(p=>p.id).filter(id=>!S.today.helpers.some(h=>h.as===id));save();render();return}
  if(a==='allout'){S.today.members.forEach(id=>clearKey('m:'+id));S.today.members=[];save();render();return}
  if(a==='copy'){const txt=maskText(orderText());
    const fb=()=>{document.getElementById('fb').innerHTML=`<textarea class="fb" id="fbt" readonly>${esc(txt)}</textarea>`;const x=document.getElementById('fbt');x.focus();x.select();toast('選択した文字をコピーしてください')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('コピーしました。LINEなどに貼り付けできます'),fb)}catch(err){fb()}return}
  if(a==='newgame'){if(!armed(t))return;const kept=S.log.length>0||total('us')+total('opp')>0;
    if(kept){S.history.unshift({date:S.game.date||ymd(),opp:oppName(),us:total('us'),them:total('opp'),text:gameText(),pairs:helperPairs()});S.history=S.history.slice(0,50)}
    const last=S.game.start||(S.lineup.some(s=>s.pid)?JSON.stringify({lineup:S.lineup,pitcher:S.pitcher,dh:S.dh}):null);if(last)S.lastOrder=last;
    const cup=S.game.cup||'';  /* 大会名は次の試合にも引き継ぐ */
    paRes=null;paMemo='';srType=null;srMemo='';S.lineup=empty9();S.pitcher=emptyS();S.log=[];S.inning=1;S.half=0;S.game=newGame();S.game.cup=cup;S.today={members:[],helpers:[]};S.tab='today';save();render();toast('新しい試合を始めます。出席メンバーを選んでください');return}
  if(a==='undo'){if(!armed(t))return;const l=S.log.pop();if(l){if(l.kind==='play'){if(l.runs)addRuns(l.side||'us',l.inning,-l.runs);
      if(l.o&&l.inning===S.inning&&l.half===S.half)addOut(-l.o)}
      else if(l.oppSnap){const o=JSON.parse(l.oppSnap);Object.assign(S.game,o)}else if(l.snap){const sn=JSON.parse(l.snap);S.lineup=sn.lineup;S.pitcher=sn.pitcher}}save();render();toast('取り消しました');return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='g-opp'){S.game.opp=t.value.trim();save();render();return}
  if(t.id==='g-cup'){S.game.cup=t.value.trim();save();return}
  if(t.id==='g-oppP'){/* 名前の書き直し：記録済みの打席・アウトの付け先も新しい名前にそろえる */
    const old=oppPitName();S.game.oppP=t.value.trim();const nw=oppPitName();
    if(old!==nw){S.log.forEach(l=>{if(l.op===old)l.op=nw;if(l.prevOp===old)l.prevOp=nw});
      const oo=S.game.oppOuts||{};if(oo[old]!==undefined){oo[nw]=(oo[nw]||0)+oo[old];delete oo[old]}}
    save();render();return}
  if(t.id==='sh-player'){sheetCtx.sel=t.value||null;updPrev();return}
  if(t.dataset.att){const id=t.dataset.att;
    if(t.checked){if(!S.today.members.includes(id))S.today.members.push(id)}
    else{S.today.members=S.today.members.filter(x=>x!==id);if(onKey('m:'+id)){clearKey('m:'+id);toast(`${P(id)?.name}さんを打順から外しました`)}}
    save();render();return}
  if(t.dataset.ha){const h=H(t.dataset.ha);if(h){h.as=t.value||null;slots().forEach(({s})=>{if(s.hid===h.id)s.pid=h.as});save();render()}return}
  if(t.dataset.hn){const h=H(t.dataset.hn);if(h&&t.value.trim()){h.name=t.value.trim();slots().forEach(({s})=>{if(s.hid===h.id)s.helper=h.name});save();render()}return}
  if(t.dataset.rn){const p=P(t.dataset.rn);if(p){p.num=t.value.trim();save()}return}
  if(t.dataset.rm){const p=P(t.dataset.rm);if(p&&t.value.trim()){p.name=t.value.trim();save()}return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='addf'){
    const n=document.getElementById('add-n').value.trim(),m=document.getElementById('add-m').value.trim();
    if(!m){toast('名前を入れてください');return}
    S.roster.push({id:uid('p'),name:m,num:n});save();render();document.getElementById('add-n').focus();toast(`${m}さんを追加しました`);return}
  if(e.target.id==='addh'){
    const n=document.getElementById('addh-n').value.trim(),a=document.getElementById('addh-a').value;
    if(!n){toast('助っ人の名前を入れてください');return}
    S.today.helpers.push({id:uid('h'),name:n,as:a||null});save();render();
    toast(a?`${n}さんを${P(a).name}さんの名義で追加しました`:`${n}さんを追加しました。名義を選んでください`);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetCtx)closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='pa-m')paMemo=e.target.value;if(e.target.id==='sr-m')srMemo=e.target.value});

load();render();
</script>

</body></html>
